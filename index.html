<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hello World</title>
<style>html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#111}h1{font:900 14vh/1 system-ui,Segoe UI,Arial,sans-serif;color:#fff;cursor:pointer;user-select:none;transition:color .2s}</style>
</head>
<body>
<h1 id="t">Hello World</h1>
<script>const t=document.getElementById('t');t.onclick=()=>t.style.color=`hsl(${Math.random()*360},90%,60%)`;</script>
</body>
</html>
