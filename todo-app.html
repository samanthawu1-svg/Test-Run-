<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>To‑Do App</title>
<style>
:root{--bg:#0f172a;--card:#111827;--accent:#22d3ee;--accent2:#a78bfa;--text:#e5e7eb;--muted:#9ca3af;--danger:#f87171}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,var(--bg),#1f2937)}
.app{width:min(680px,92vw);background:linear-gradient(180deg,var(--card),#0b1220);color:var(--text);padding:24px 22px;border-radius:14px;box-shadow:0 20px 50px #0008}
h1{margin:0 0 14px;font:700 26px/1.2 system-ui,Segoe UI,Roboto}
.row{display:flex;gap:10px}
input{flex:1;padding:12px 14px;border:1px solid #334155;border-radius:10px;background:#0b1220;color:var(--text);outline:none}
input::placeholder{color:var(--muted)}
button{padding:12px 16px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0b1220;font-weight:700;cursor:pointer;transition:transform .05s ease,filter .2s}
button:hover{filter:saturate(1.2) brightness(1.05)}
button:active{transform:translateY(1px)}
ul{margin:16px 0 0;padding:0;list-style:none;display:grid;gap:8px}
li{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #1f2937;border-radius:10px;background:#0c1424}
li.done .text{color:var(--muted);text-decoration:line-through}
.spacer{flex:1}
.del{background:#0b1220;color:var(--danger);border:1px solid #374151;padding:8px 10px;border-radius:8px}
.del:hover{background:#111827}
</style>
</head>
<body>
<div class="app" role="application" aria-label="To-do list">
<h1>To‑Do</h1>
<div class="row">
<input id="taskInput" placeholder="Add a task and press Enter..." />
<button id="addBtn" aria-label="Add task">Add</button>
</div>
<ul id="list" aria-live="polite"></ul>
</div>
<script>
const input=document.getElementById('taskInput');
const list=document.getElementById('list');
const addBtn=document.getElementById('addBtn');
function addTask(){
  const text=input.value.trim();
  if(!text)return;
  const li=document.createElement('li');
  const cb=document.createElement('input');cb.type='checkbox';cb.ariaLabel='Mark complete';
  const span=document.createElement('span');span.className='text';span.textContent=text;
  const del=document.createElement('button');del.textContent='Delete';del.className='del';del.ariaLabel='Delete task';
  const spacer=document.createElement('span');spacer.className='spacer';
  cb.addEventListener('change',()=>li.classList.toggle('done',cb.checked));
  del.addEventListener('click',()=>li.remove());
  li.append(cb,span,spacer,del);
  list.append(li);
  input.value='';
  input.focus();
}
addBtn.addEventListener('click',addTask);
input.addEventListener('keydown',e=>{if(e.key==='Enter')addTask()});
</script>
</body>
</html>
