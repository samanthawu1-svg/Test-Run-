<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Counter</title>
<style>body{display:grid;place-items:center;height:100vh;margin:0;font:700 12vh/1 system-ui,Segoe UI,Arial,sans-serif}button{font:inherit;padding:.2em .5em;cursor:pointer}</style>
</head>
<body>
<button id="btn">0</button>
<script>const b=document.getElementById('btn');let n=0;b.onclick=()=>{b.textContent=String(++n);};</script>
</body>
</html>
